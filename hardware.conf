# pisynth hardware configuration — the SPI display panel.
#
# Read by migrations/004-screen-overlay.sh to set up the screen. Edit this for a
# different panel, then re-apply (./deploy.sh, or `sudo apply.sh --redo` to force
# migration 004 to re-run; a boot-config change triggers an automatic reboot).
#
# Shell KEY=value (sourced by the migration). Keep it valid bash: no spaces around =.

# Device-tree overlay for the panel. Default: piscreen (ILI9486 + ADS7846 touch,
# the "goodtft/MPI3501" red board). Other 3.5" boards use e.g. tft35a, mhs35,
# waveshare35a — see /boot/overlays/ and the board's docs.
SCREEN_OVERLAY=piscreen

# Extra parameters appended after the overlay name (comma-separated), or empty.
# piscreen accepts: speed (SPI clock in Hz) and rotate (0|90|180|270).
SCREEN_OVERLAY_PARAMS=speed=16000000,rotate=90

# Enable the SPI bus (required by SPI panels): on|off.
SCREEN_SPI=on

# --- Auto-detected at runtime (documented here for reference; not set by you) ---
# Resolution : read from /dev/fb0 by the UI — nothing to configure.
# Touch      : ADS7846 auto-detected via evdev by the UI.
# Backlight  : hardwired ON on the reference panel — no software off (see docs/roadmap.md, #277).
# Tile grid  : the UI's home/preset grid is 3x2 (6) tiles per page by default; change
#              it in Settings → Tiles per page.
