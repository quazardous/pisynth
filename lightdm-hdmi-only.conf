# Installed to /etc/systemd/system/lightdm.service.d/hdmi-only.conf
# Only start the desktop (lightdm -> Wayland/labwc) when an HDMI screen is
# attached. ExecCondition failure (exit 1-254) makes systemd SKIP the unit
# cleanly, not fail it — so graphical.target still completes and the console
# autologin + piano.service run normally on a headless boot.
#
# Note: checked only at service start. To get the desktop after plugging HDMI
# on a running headless box: `sudo systemctl start lightdm` (or reboot).
[Service]
ExecCondition=/usr/local/bin/pisynth-hdmi-connected
